[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "her-windows-voice"
version = "0.4.0"
description = "Open OS1: local Windows speech runtime and browser client with configurable Agent endpoints"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "patches/audio.cpp/LICENSE.upstream"]
requires-python = ">=3.11,<3.15"
dependencies = ["aiohttp==3.14.5"]

[project.urls]
Homepage = "https://github.com/next1foreal-dotcom/her-voice-windows"
Repository = "https://github.com/next1foreal-dotcom/her-voice-windows"
Issues = "https://github.com/next1foreal-dotcom/her-voice-windows/issues"

[project.scripts]
her-voice = "her_voice.__main__:main"
voice-runtime = "her_voice.__main__:main"
voice-pin-silero = "her_voice.upstream_patch:main"

[tool.setuptools]
packages = ["her_voice"]
