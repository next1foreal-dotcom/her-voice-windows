[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "her-windows-voice"
version = "0.4.0"
description = "Reusable local voice runtime and browser client with configurable Agent endpoints"
requires-python = ">=3.11,<3.15"
dependencies = ["aiohttp==3.14.5"]

[project.scripts]
her-voice = "her_voice.__main__:main"
voice-runtime = "her_voice.__main__:main"
voice-pin-silero = "her_voice.upstream_patch:main"

[tool.setuptools]
packages = ["her_voice"]
